<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .muuhu-loader-arc {
      animation: muuhu-loader-spin 1s linear infinite;
      transform-origin: 32px 32px;
    }

    @keyframes muuhu-loader-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .muuhu-loader-arc {
        animation: none;
      }
    }
  </style>
  <circle
    cx="32"
    cy="32"
    fill="none"
    opacity=".2"
    r="26"
    stroke="#b89556"
    stroke-width="5"
  />
  <circle
    class="muuhu-loader-arc"
    cx="32"
    cy="32"
    fill="none"
    r="26"
    stroke="#b89556"
    stroke-dasharray="82 164"
    stroke-linecap="round"
    stroke-width="5"
  />
</svg>
